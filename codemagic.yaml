workflows:
  firefighters-fitness-test:
    name: Firefighters Fitness Test
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Berfau ASC
    environment:
      ios_signing:
        provisioning_profiles:
          - fft_ios
          - fft_watch
        certificates:
          - berfau_dist
          - berfau_dist1
      vars:
        APP_STORE_APPLE_ID: 6830260091
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Set up signing
        script: |
          set -e
          xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "FirefightersFitnessTest.xcodeproj" \
            --scheme "FirefightersFitnessTest"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
