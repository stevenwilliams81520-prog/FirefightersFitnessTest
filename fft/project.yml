name: FirefightersFitnessTest
options:
  bundleIdPrefix: com.stevenwilliams
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # Codemagic fills in signing; add your Team ID here if building locally
    CODE_SIGN_STYLE: Manual
targets:
  FirefightersFitnessTest:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Fitness Test
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevenwilliams.firefightersfitnesstest
        PRODUCT_NAME: FirefightersFitnessTest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FFTWatch
    scheme: {}

  FFTWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Fitness Test
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.stevenwilliams.firefightersfitnesstest
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Fitness Test reads your heart rate during the Chester Step Test to record each stage and stop the test at your target heart rate.
        NSHealthUpdateUsageDescription: Fitness Test saves the step test as a workout in Health.
    entitlements:
      path: Watch/FFTWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevenwilliams.firefightersfitnesstest.watchkitapp
        PRODUCT_NAME: FFTWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
